# RuneMobile upstream watch — NOTIFY (never auto-merge) when runelite/runelite moves ahead of master.
#
# Every OSRS weekly update bumps the client revision upstream; until that bump lands here the app dies at
# login with js5connect_outofdate. This workflow polls upstream every 6 hours and, when upstream/master has
# new commits, FAILS LOUDLY (GitHub emails the owner) with a pointer to the manual merge playbook.
#
# It deliberately does NOT auto-merge, run any upstream build code, or hold a push token. Why the merge stays
# a reviewed, manual step:
#   - Supply chain: auto-adopting upstream/master into a build that decodes the release signing key — with no
#     human review of the upstream diff — would let a single malicious upstream commit exfiltrate the key (a
#     compile/contract gate cannot prevent exfiltration). Running upstream Gradle next to a push token on one
#     runner is the same class of risk (a planted pre-push hook could steal the token).
# master shares real history with runelite/runelite (this repo is a genuine fork), so the merge is the usual
# `git fetch upstream && git merge upstream/master` → fix any API breaks (e.g. rev239's
# getMapAngle→getCameraYaw) → push. release-hosted then rebuilds + republishes both apps on the push.
# See tools/ci/README.md.
name: upstream-sync

on:
  schedule:
    - cron: '23 */6 * * *' # 4x/day; OSRS updates land Wednesdays and upstream usually bumps within hours
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  watch:
    # Runs only on the canonical repo (id 1296635776), whose master shares real history with runelite/runelite
    # so the ancestor check is meaningful; inert in any fork.
    if: github.repository_id == '1296635776'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read   # the built-in GITHUB_TOKEN is read-only here — no write scope, so nothing can be pushed
    steps:
      # Pinned to a full commit SHA (not the mutable @v4 tag) — supply-chain hygiene. The only credential is
      # checkout's default built-in GITHUB_TOKEN, scoped read-only above and NOT persisted into .git/config
      # (persist-credentials: false). No PAT, no upstream code runs, nothing pushes.
      - name: Checkout master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream (fetch only — no upstream code is executed)
        run: |
          git remote add upstream https://github.com/runelite/runelite.git 2>/dev/null \
            || git remote set-url upstream https://github.com/runelite/runelite.git
          git fetch --no-tags upstream master

      - name: Fail loudly if master is behind upstream/master
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "master is current with upstream/master — nothing to do."
            exit 0
          fi
          behind="$(git rev-list --count HEAD..upstream/master)"
          echo "::error::runelite/runelite is $behind commit(s) ahead of master — an OSRS revision bump may be pending (js5connect_outofdate). Merge locally per the playbook (git fetch upstream && git merge upstream/master → fix API breaks → push). See tools/ci/README.md."
          git --no-pager log --oneline HEAD..upstream/master | head -30
          exit 1
