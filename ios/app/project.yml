name: HelloShell
options:
  bundleIdPrefix: dev.audaro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1"          # iPhone
    ENABLE_BITCODE: NO
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_OBJC_ARC: YES
    # OpenGLES is deprecated-since-iOS-12 (Apple pushes Metal) but works on iOS 26 — the GPU Route C bridge +
    # GLRecon use it deliberately. Silence the ~100 deprecation warnings target-wide so real warnings stay visible.
    GCC_PREPROCESSOR_DEFINITIONS:
      - "$(inherited)"
      - "GLES_SILENCE_DEPRECATION=1"
    # Let the resign-jre build phase write into the .app.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  HelloShell:
    type: application
    platform: iOS
    sources:
      - path: HelloShell
      # The verified Amethyst jre21 (gitignored, ~24MB) — copied verbatim into
      # the .app as `jre/` (folder reference; Xcode must NOT treat it as linked
      # frameworks). Re-signed by scripts/resign-jre.sh after this copy.
      - path: ../dev-tools/jre
        type: folder
        buildPhase: resources
      - path: jvm-resources/probes.jar
        buildPhase: resources
      # §6.2: the shaded RuneLite client (all deps) — gitignored build artifact, ~29 MB.
      - path: jvm-resources/client-1.12.28-SNAPSHOT-shaded.jar
        buildPhase: resources
      # W3 GPU Route C: the native JNI GL bridge (EAGL ES3 AWTContext analogue + 97 forwarders) compiled into
      # the shell. RouteCProbe.m / main.m in the same dir are the Simulator harness — NOT added here.
      - path: ../dev-tools/gpu-routec/app/RouteCBridge.m
      - path: ../dev-tools/gpu-routec/jni/routec_gl_jni.m
      # W3 GPU Route C — L1 kill-test jar (facade-native + RouteCL1Probe only; gitignored build artifact).
      - path: jvm-resources/routec-l1.jar
        buildPhase: resources
    dependencies:
      # WKWebView for the on-device Jagex login (JagexLoginSpikeViewController).
      - sdk: WebKit.framework
      # W3 GPU track B0 recon (GLRecon): native GPU/GL capability query.
      - sdk: Metal.framework
      - sdk: OpenGLES.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.audaro.helloshell
        INFOPLIST_FILE: HelloShell/Info.plist
        CODE_SIGN_ENTITLEMENTS: HelloShell/HelloShell.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5NZ6CPA994   # team OU of the Apple Development cert (jordansimps@me.com)
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Hello has no Obj-C/Swift dylib deps of its own; the JRE is dlopen'd at runtime.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        # GPU Route C bridge headers (RouteCBridge.h / routec_gl_jni.h) live under dev-tools/gpu-routec;
        # routec_gl_jni.m does `#include <jni.h>`, resolved from the embedded JNI headers in HelloShell/jni.
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../dev-tools/gpu-routec/app"
          - "$(SRCROOT)/../dev-tools/gpu-routec/jni"
          - "$(SRCROOT)/HelloShell/jni"
    postBuildScripts:
      - script: "\"${SRCROOT}/scripts/resign-jre.sh\""
        name: "Re-sign embedded JRE"
        basedOnDependencyAnalysis: false
        # Runs after Copy Bundle Resources, before Xcode's final app signing.
